deploymentName: message-deployment
serviceName: message
appLabel: message
appName: messagems

replicaCount: 1

image:
  repository: pkumar25/messagems
  tag: s17

containerPort: 7070

service:
  type: ClusterIP
  port: 7070
  targetPort: 7070

appname_enabled: true
profile_enabled: false
config_enabled: false
discovery_enabled: false
resouceserver_enabled: false
otel_enabled: false
kafka_enabled: true
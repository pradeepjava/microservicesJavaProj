apiVersion: v1
kind: ConfigMap
metadata:
  name: eazybank-configmap
  namespace: eazybank
data:
  SPRING_PROFILES_ACTIVE: "default"
  SPRING_CONFIG_IMPORT: "optional:configserver:http://configserver:8071/"
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eurekaserver:8761/eureka/"
  CONFIGSERVER_APPLICATION_NAME: "configserverms"
  EUREKA_APPLICATION_NAME: "eurekaserverms"
  ACCOUNTS_APPLICATION_NAME: "accountsms"
  LOANS_APPLICATION_NAME: "loansms"
  CARDS_APPLICATION_NAME: "cardsms"
  GATEWAY_APPLICATION_NAME: "gatewayserverms"
  KEYCLOAK_ADMIN: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "admin"
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: "http://keycloak:8070/realms/master/protocol/openid-connect/certs"
  SPRING_DATA_REDIS_CONNECT_TIMEOUT: "2s"
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_TIMEOUT: "1s"
  EUREKA_PORT: "8761"
  GATEWAY_SERVER_PORT: "8072"
